name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: zypper --non-interactive install nim mbedtls-devel gcc ca-certificates-mozilla

      - name: Build
        run: nim c --path:src src/mbedtls.nim

      - name: Tier 1 — binding validation
        run: nim c -r --path:src tests/t_bindings.nim

      - name: Tier 2 — TLS integration
        run: nim c -r --path:src tests/t_tls_client.nim
